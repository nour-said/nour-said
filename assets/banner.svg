<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Nourhan Said - AI Engineer, Computer Vision and GenAI, AI Mentor">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6D28D9"/>
      <stop offset="1" stop-color="#06B6D4"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>

  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="90" y1="60" x2="180" y2="130"/>
    <line x1="90" y1="200" x2="180" y2="130"/>
    <line x1="180" y1="130" x2="270" y2="70"/>
    <line x1="180" y1="130" x2="280" y2="195"/>
    <line x1="90" y1="60" x2="270" y2="70"/>
    <line x1="90" y1="200" x2="280" y2="195"/>
  </g>
  <g fill="#ffffff">
    <circle cx="90" cy="60" r="7" fill-opacity="0.8"/>
    <circle cx="90" cy="200" r="7" fill-opacity="0.8"/>
    <circle cx="180" cy="130" r="9">
      <animate attributeName="fill-opacity" values="0.5;1;0.5" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="270" cy="70" r="7" fill-opacity="0.8"/>
    <circle cx="280" cy="195" r="7" fill-opacity="0.8"/>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <line x1="1110" y1="60" x2="1020" y2="130"/>
    <line x1="1110" y1="200" x2="1020" y2="130"/>
    <line x1="1020" y1="130" x2="930" y2="70"/>
    <line x1="1020" y1="130" x2="920" y2="195"/>
    <line x1="1110" y1="60" x2="930" y2="70"/>
    <line x1="1110" y1="200" x2="920" y2="195"/>
  </g>
  <g fill="#ffffff">
    <circle cx="1110" cy="60" r="7" fill-opacity="0.8"/>
    <circle cx="1110" cy="200" r="7" fill-opacity="0.8"/>
    <circle cx="1020" cy="130" r="9">
      <animate attributeName="fill-opacity" values="1;0.5;1" dur="3s" repeatCount="indefinite"/>
    </circle>
    <circle cx="930" cy="70" r="7" fill-opacity="0.8"/>
    <circle cx="920" cy="195" r="7" fill-opacity="0.8"/>
  </g>

  <g text-anchor="middle" fill="#ffffff" font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="600" y="120" font-size="58" font-weight="700">Nourhan Said</text>
    <text x="600" y="165" font-size="23" font-weight="500">AI Engineer  |  Computer Vision &amp; GenAI  |  AI Mentor</text>
    <text x="600" y="202" font-size="16" fill-opacity="0.9">Building AI for disaster resilience</text>
  </g>
</svg>
